<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff9ec7;
    --pink-deep: #e0508f;
    --lilac: #d9c8ec;
    --ink: #5b4670;
    --card-pink: #ffd3e4;
    --card-lilac: #e4d6ff;
    --card-sky: #cfe8ff;
    --card-mint: #cdf3e1;
    --card-peach: #ffe2cf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #ffd9e8, #e4d6ff 35%, #cfe8ff 65%, #d5f5e6);
    background-size: 300% 300%;
    animation: drift 18s ease-in-out infinite;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  @keyframes drift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow-y: auto;
  }
  .screen.active { display: flex; animation: fadein .7s ease both; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  button { font-family: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--pink-deep); outline-offset: 4px; }

  /* ---------- Screen 1: the cat game ---------- */
  #game { padding: 0; overflow: hidden; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .hud {
    position: relative;
    z-index: 2;
    pointer-events: none;
    text-align: center;
    padding: max(22px, env(safe-area-inset-top)) 20px 0;
  }
  .hud h1 {
    font-size: clamp(1.05rem, 4.2vw, 2rem);
    font-weight: 600;
    line-height: 1.25;
    letter-spacing: .02em;
    color: var(--pink-deep);
    max-width: 22em;
    margin: 0 auto;
  }
  .hud p {
    margin-top: 10px;
    display: inline-block;
    padding: 6px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .6);
    font-size: clamp(.95rem, 3.4vw, 1.2rem);
    font-weight: 500;
  }

  /* ---------- Screen 2: do you love me? ---------- */
  #ask { justify-content: center; text-align: center; overflow: hidden; }
  #ask h1 {
    position: relative;
    z-index: 0;
    font-size: clamp(2.4rem, 10vw, 5rem);
    font-weight: 600;
    color: var(--pink-deep);
    animation: flash .55s ease-in-out 6;
  }
  @keyframes flash { 0%, 100% { opacity: 1; } 50% { opacity: .05; } }

  .choices {
    margin-top: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 28px;
  }
  .btn {
    border: none;
    border-radius: 999px;
    padding: 14px 40px;
    font-size: 1.5rem;
    font-weight: 600;
    box-shadow: 0 6px 0 rgba(91, 70, 112, .18);
  }
  #yes {
    position: relative;
    z-index: 1;
    background: var(--pink-deep);
    color: #fff;
    transform-origin: center;
    transition: transform .35s cubic-bezier(.3, 1.4, .5, 1);
  }
  #no {
    position: relative;
    z-index: 3;
    background: #fff;
    color: var(--ink);
  }
  #no.loose {
    position: fixed;
    margin: 0;
    transition: left .28s ease, top .28s ease;
  }

  /* ---------- Screen 3: counter + letter ---------- */
  #together .inner {
    margin: auto;
    width: 100%;
    max-width: 640px;
    text-align: center;
    padding: 24px 0;
  }
  #together h2 {
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 500;
    margin-bottom: 26px;
  }
  .tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 14px;
  }
  .tile {
    border-radius: 26px;
    padding: 18px 8px 14px;
  }
  .tile:nth-child(1) { background: var(--card-pink); }
  .tile:nth-child(2) { background: var(--card-lilac); border-radius: 26px 26px 26px 8px; }
  .tile:nth-child(3) { background: var(--card-sky); }
  .tile:nth-child(4) { background: var(--card-mint); border-radius: 26px 8px 26px 26px; }
  .tile:nth-child(5) { background: var(--card-peach); }
  .tile .num {
    display: block;
    font-size: clamp(2.2rem, 9vw, 3.4rem);
    font-weight: 600;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .tile .lbl { display: block; margin-top: 8px; font-size: 1rem; opacity: .8; }

  .surprise {
    margin-top: 48px;
    background: none;
    border: none;
    font-size: clamp(1.3rem, 5vw, 1.8rem);
    font-weight: 500;
    color: var(--pink-deep);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 7px;
    padding: 8px 12px;
  }

  /* letter pop-up */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(228, 214, 255, .55);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .overlay.open { display: flex; }
  .letter {
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 88vh;
    max-height: 88dvh;
    overflow-y: auto;
    background: rgba(255, 255, 255, .92);
    border-radius: 30px;
    padding: 40px 30px 30px;
    box-shadow: 0 20px 60px rgba(150, 110, 190, .3);
    animation: pop .5s cubic-bezier(.3, 1.3, .5, 1) both;
  }
  @keyframes pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .letter p {
    font-family: "Lora", Georgia, serif;
    font-size: 1.05rem;
    line-height: 1.8;
    white-space: pre-wrap;
    margin-bottom: 1.1em;
  }
  .letter p:first-child {
    font-family: "Fredoka", sans-serif;
    font-size: 1.5rem;
    font-weight: 600;
    color: var(--pink-deep);
  }
  .letter p.typing::after {
    content: "";
    display: inline-block;
    width: 2px;
    height: 1.1em;
    margin-left: 2px;
    vertical-align: text-bottom;
    background: var(--pink-deep);
    animation: caret 1s steps(1) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  .letter-actions {
    position: sticky;
    top: -28px;
    float: right;
    margin: -28px -16px 0 0;
    display: flex;
    gap: 6px;
  }
  .mini {
    border: none;
    background: var(--card-lilac);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .9rem;
  }

  @media (prefers-reduced-motion: reduce) {
    body { animation: none; }
    #ask h1 { animation: none; }
    .screen.active, .letter { animation: none; }
    #yes, #no.loose { transition: none; }
  }
</style>
</head>
<body>

<!-- Screen 1 -->
<section class="screen active" id="game" aria-label="Catch the cats game">
  <canvas id="stage"></canvas>
  <div class="hud">
    <h1>CATCH FIVE CATS TO PROCEED TO THE NEXT SCREEN!</h1>
    <p id="score">Cats caught: 0 / 5</p>
  </div>
</section>

<!-- Screen 2 -->
<section class="screen" id="ask" aria-label="A question">
  <h1>do you love me?</h1>
  <div class="choices">
    <button class="btn" id="yes" type="button">yes</button>
    <button class="btn" id="no" type="button">no</button>
  </div>
</section>

<!-- Screen 3 -->
<section class="screen" id="together" aria-label="Time together">
  <div class="inner">
    <h2>we've been together for</h2>
    <div class="tiles" aria-live="off">
      <div class="tile"><span class="num" id="c-months">0</span><span class="lbl" id="l-months">months</span></div>
      <div class="tile"><span class="num" id="c-days">0</span><span class="lbl" id="l-days">days</span></div>
      <div class="tile"><span class="num" id="c-hours">0</span><span class="lbl" id="l-hours">hours</span></div>
      <div class="tile"><span class="num" id="c-mins">0</span><span class="lbl" id="l-mins">minutes</span></div>
      <div class="tile"><span class="num" id="c-secs">0</span><span class="lbl" id="l-secs">seconds</span></div>
    </div>
    <button class="surprise" id="surpriseBtn" type="button">click for a surprise</button>
  </div>
</section>

<!-- Letter pop-up -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="A message for you">
  <div class="letter" id="letter">
    <div class="letter-actions">
      <button class="mini" id="skipBtn" type="button">show all</button>
      <button class="mini" id="closeBtn" type="button" aria-label="Close">close</button>
    </div>
    <div id="letterText"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (s) => document.querySelector(s);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ============ CHANGE THIS IF NEEDED ============
     The date you got together. Month is 0-based: 6 = July.
     (3 months on Oct 12, 2026 means it started July 12, 2026.) */
  const START = new Date(2026, 6, 12, 0, 0, 0);

  const LETTER = [
    `Happy monthsary, baby.`,

    `If I could gather every season we have lived through and lay them out before you, you would see how much weather we have survived together. There were mornings so bright they felt borrowed from some kinder world, and nights so heavy I forgot there had ever been that kind of sun. We have had our ups and our downs, and I'm not going to pretend we've been perfect. Love that only remembers the gentle days is not love at all, only a story people tell themselves. There were times I thought of you as bad and as good, as dark and as light. I held both truths, and I have been unsure which one was you. But the years taught me what I could not see then, that you were never one or the other. It is ironic that my name is Skylar, because you are my whole sky, the storm and the clearing after it, the midnight and the dawn that always followed. I wanted all of it. I needed all of you. I needed every shade of you to learn what I was capable of loving, and hell, despite everything, you made love feel easy and comfortable.`,

    `Through all of these years, and months, you stayed. You stayed when staying with me I know is not easy, when I was locked, and you waited anyway. You stayed through my silences and my overbearing words. You stayed through the days I was difficult to hold and the days I was easy to love. And you understood me, in most of the ways that mattered. Where you could not fully understand me, you chose to stay gentle, and I have come to believe that is its own kind of understanding, perhaps the deepest kind, too.`,

    `I have searched for the words to tell you what you are to me, and I keep returning empty-handed. Every word I find is nothing but a candle to the sun. So forgive me if my words fall short. Perhaps let them be a lantern held out toward everything I feel but cannot name. You are my home, my reason, and my steadiest star. My always.`,

    `You have always been the one place in this whole wide world where my heart rests, safe and sound.\nThank you for the years behind us, and for every one still waiting ahead.`,

    `I love you, today and for every day after.`
  ];

  /* ---------- screen switching ---------- */
  const screens = { game: $("#game"), ask: $("#ask"), together: $("#together") };
  let counterTimer = null;

  function show(name) {
    Object.values(screens).forEach((s) => s.classList.remove("active"));
    screens[name].classList.add("active");
    if (name === "ask") initAsk();
    if (name === "together") startCounter();
  }

  /* =====================================================
     SCREEN 1 — catch the cats
  ===================================================== */
  const canvas = $("#stage");
  const ctx = canvas.getContext("2d");
  const scoreEl = $("#score");
  const GOAL = 5;

  let W = 0, H = 0;
  const basket = { x: 0, target: 0, w: 120, h: 66, y: 0 };
  let cats = [], pops = [];
  let caught = 0, spawnT = 0, last = performance.now();
  let finished = false, running = true;
  const keys = { left: false, right: false };

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    basket.w = Math.max(100, Math.min(160, W * 0.3));
    basket.h = basket.w * 0.55;
    basket.y = H - basket.h - Math.max(26, H * 0.05);
    if (!basket.x) basket.x = W / 2;
    basket.x = Math.min(Math.max(basket.x, basket.w / 2), W - basket.w / 2);
    basket.target = basket.x;
  }
  window.addEventListener("resize", resize);
  resize();

  function setTarget(x) {
    basket.target = Math.min(Math.max(x, basket.w / 2), W - basket.w / 2);
  }
  canvas.addEventListener("pointermove", (e) => setTarget(e.clientX));
  canvas.addEventListener("pointerdown", (e) => setTarget(e.clientX));
  window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = true;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = true;
  });
  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a") keys.left = false;
    if (e.key === "ArrowRight" || e.key === "d") keys.right = false;
  });

  function spawnCat() {
    const r = Math.max(22, Math.min(34, W * 0.065));
    const speedScale = Math.max(0.75, H / 800);
    cats.push({
      x: r + Math.random() * (W - r * 2),
      y: -r * 2,
      r,
      vy: (170 + Math.random() * 110) * speedScale,
      rot: (Math.random() - 0.5) * 0.5,
      spin: (Math.random() - 0.5) * 0.8
    });
  }

  function update(dt) {
    const move = 700 * dt;
    if (keys.left) setTarget(basket.target - move);
    if (keys.right) setTarget(basket.target + move);
    basket.x += (basket.target - basket.x) * Math.min(1, dt * 18);

    spawnT += dt;
    if (!finished && spawnT > 0.85) { spawnT = 0; spawnCat(); }

    for (let i = cats.length - 1; i >= 0; i--) {
      const c = cats[i];
      c.y += c.vy * dt;
      c.rot += c.spin * dt;

      const inBasketY = c.y + c.r * 0.5 >= basket.y && c.y < basket.y + basket.h * 0.5;
      const inBasketX = Math.abs(c.x - basket.x) < basket.w / 2 - 6;
      if (!finished && inBasketY && inBasketX) {
        cats.splice(i, 1);
        caught++;
        scoreEl.textContent = "Cats caught: " + caught + " / " + GOAL;
        pops.push({ x: c.x, y: basket.y - 10, t: 0 });
        if (caught >= GOAL) {
          finished = true;
          scoreEl.textContent = "You did it!";
          setTimeout(() => { running = false; show("ask"); }, 900);
        }
        continue;
      }
      if (c.y > H + c.r * 2) cats.splice(i, 1);
    }

    for (let i = pops.length - 1; i >= 0; i--) {
      pops[i].t += dt;
      if (pops[i].t > 0.8) pops.splice(i, 1);
    }
  }

  function drawCat(x, y, r, rot) {
    const edge = "#d4c0ea";
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.lineJoin = "round";
    ctx.lineCap = "round";

    // tail
    ctx.beginPath();
    ctx.moveTo(r * 0.5, r * 0.95);
    ctx.quadraticCurveTo(r * 1.55, r * 0.95, r * 1.25, r * 0.15);
    ctx.strokeStyle = edge; ctx.lineWidth = r * 0.38; ctx.stroke();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = r * 0.25; ctx.stroke();

    // body
    ctx.beginPath();
    ctx.ellipse(0, r * 0.9, r * 0.78, r * 0.62, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = Math.max(2, r * 0.08); ctx.stroke();

    // ears
    [[-1], [1]].forEach(([s]) => {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.9, -r * 0.1);
      ctx.lineTo(s * r * 0.72, -r * 1.2);
      ctx.lineTo(s * r * 0.12, -r * 0.78);
      ctx.closePath();
      ctx.fillStyle = "#fff"; ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(s * r * 0.72, -r * 0.35);
      ctx.lineTo(s * r * 0.64, -r * 0.92);
      ctx.lineTo(s * r * 0.3, -r * 0.7);
      ctx.closePath();
      ctx.fillStyle = "#ffc2d9"; ctx.fill();
    });

    // head
    ctx.beginPath();
    ctx.ellipse(0, 0, r, r * 0.88, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = Math.max(2, r * 0.08); ctx.stroke();

    // face
    ctx.fillStyle = "#4a3a5c";
    [-1, 1].forEach((s) => {
      ctx.beginPath(); ctx.arc(s * r * 0.4, -r * 0.02, r * 0.1, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "rgba(255,150,190,.5)";
    [-1, 1].forEach((s) => {
      ctx.beginPath(); ctx.arc(s * r * 0.64, r * 0.26, r * 0.15, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#ff8fb8";
    ctx.beginPath();
    ctx.moveTo(-r * 0.1, r * 0.16); ctx.lineTo(r * 0.1, r * 0.16); ctx.lineTo(0, r * 0.28);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#4a3a5c"; ctx.lineWidth = Math.max(1.5, r * 0.05);
    ctx.beginPath();
    ctx.moveTo(0, r * 0.28);
    ctx.quadraticCurveTo(-r * 0.05, r * 0.42, -r * 0.2, r * 0.38);
    ctx.moveTo(0, r * 0.28);
    ctx.quadraticCurveTo(r * 0.05, r * 0.42, r * 0.2, r * 0.38);
    ctx.stroke();
    ctx.strokeStyle = "rgba(74,58,92,.35)"; ctx.lineWidth = Math.max(1, r * 0.04);
    ctx.beginPath();
    [-1, 1].forEach((s) => {
      ctx.moveTo(s * r * 0.55, r * 0.15); ctx.lineTo(s * r * 1.1, r * 0.08);
      ctx.moveTo(s * r * 0.55, r * 0.28); ctx.lineTo(s * r * 1.1, r * 0.34);
    });
    ctx.stroke();

    ctx.restore();
  }

  function roundedTrapezoid(x, y, topW, botW, h, rad) {
    const tl = x - topW / 2, tr = x + topW / 2, bl = x - botW / 2, br = x + botW / 2;
    ctx.beginPath();
    ctx.moveTo(tl, y);
    ctx.lineTo(tr, y);
    ctx.lineTo(br, y + h - rad);
    ctx.quadraticCurveTo(br, y + h, br - rad, y + h);
    ctx.lineTo(bl + rad, y + h);
    ctx.quadraticCurveTo(bl, y + h, bl, y + h - rad);
    ctx.closePath();
  }

  function drawBasket() {
    const { x, y, w, h } = basket;
    const rimH = h * 0.24;
    const bodyH = h - rimH * 0.6;

    ctx.save();
    // body
    roundedTrapezoid(x, y + rimH * 0.6, w * 0.94, w * 0.74, bodyH, 12);
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, "#ffb7d5");
    g.addColorStop(1, "#f57fb0");
    ctx.fillStyle = g; ctx.fill();

    // weave
    ctx.save();
    roundedTrapezoid(x, y + rimH * 0.6, w * 0.94, w * 0.74, bodyH, 12);
    ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,.45)";
    ctx.lineWidth = 2.5;
    for (let i = 1; i < 4; i++) {
      const yy = y + rimH * 0.6 + (bodyH / 4) * i;
      ctx.beginPath(); ctx.moveTo(x - w, yy); ctx.lineTo(x + w, yy); ctx.stroke();
    }
    for (let i = -6; i <= 6; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * w * 0.16, y);
      ctx.lineTo(x + i * w * 0.16 - w * 0.12, y + h);
      ctx.stroke();
    }
    ctx.restore();

    // rim
    const rx = x - w / 2 - 4, rw = w + 8, rr = rimH / 2;
    ctx.beginPath();
    ctx.moveTo(rx + rr, y);
    ctx.lineTo(rx + rw - rr, y);
    ctx.arc(rx + rw - rr, y + rr, rr, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(rx + rr, y + rimH);
    ctx.arc(rx + rr, y + rr, rr, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
    ctx.fillStyle = "#ff8fbd"; ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    cats.forEach((c) => drawCat(c.x, c.y, c.r, c.rot));
    drawBasket();
    pops.forEach((p) => {
      const k = p.t / 0.8;
      ctx.save();
      ctx.globalAlpha = 1 - k;
      ctx.fillStyle = "#e0508f";
      ctx.font = "600 26px Fredoka, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("+1", p.x, p.y - k * 40);
      ctx.restore();
    });
  }

  function frame(now) {
    if (!running) return;
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* =====================================================
     SCREEN 2 — do you love me?
  ===================================================== */
  let askReady = false, tries = 0, lastFlee = 0;

  function initAsk() {
    if (askReady) return;
    askReady = true;
    const yes = $("#yes");
    const no = $("#no");

    function flee(e) {
      if (e && e.cancelable) e.preventDefault();
      const now = Date.now();
      if (now - lastFlee < 250) return;
      lastFlee = now;
      tries++;

      // yes gets bigger every attempt
      const scale = Math.min(1 + tries * 0.5, 18);
      yes.style.transform = "scale(" + scale + ")";

      const rect = no.getBoundingClientRect();
      if (!no.classList.contains("loose")) {
        const ph = document.createElement("span");
        ph.style.width = rect.width + "px";
        ph.style.height = rect.height + "px";
        no.parentNode.insertBefore(ph, no);
        no.classList.add("loose");
      }

      const w = no.offsetWidth, h = no.offsetHeight, pad = 12;
      const px = e && e.clientX != null ? e.clientX : rect.left + rect.width / 2;
      const py = e && e.clientY != null ? e.clientY : rect.top + rect.height / 2;
      let best = null, bestD = -1;
      for (let i = 0; i < 10; i++) {
        const x = pad + Math.random() * Math.max(1, window.innerWidth - w - pad * 2);
        const y = pad + Math.random() * Math.max(1, window.innerHeight - h - pad * 2);
        const d = Math.hypot(x + w / 2 - px, y + h / 2 - py);
        if (d > bestD) { bestD = d; best = { x, y }; }
      }
      no.style.left = best.x + "px";
      no.style.top = best.y + "px";
    }

    no.addEventListener("pointerenter", flee);
    no.addEventListener("pointerdown", flee);
    no.addEventListener("click", flee);
    no.addEventListener("touchstart", flee, { passive: false });

    yes.addEventListener("click", () => show("together"));
  }

  /* =====================================================
     SCREEN 3 — counter + letter
  ===================================================== */
  function elapsed() {
    const now = new Date();
    if (now <= START) return { m: 0, d: 0, h: 0, mi: 0, s: 0 };
    let months = (now.getFullYear() - START.getFullYear()) * 12 + (now.getMonth() - START.getMonth());
    const anchorOf = (m) => new Date(START.getFullYear(), START.getMonth() + m, START.getDate(), 0, 0, 0);
    let anchor = anchorOf(months);
    if (anchor > now) { months--; anchor = anchorOf(months); }
    let ms = now - anchor;
    const d = Math.floor(ms / 86400000); ms -= d * 86400000;
    const h = Math.floor(ms / 3600000); ms -= h * 3600000;
    const mi = Math.floor(ms / 60000); ms -= mi * 60000;
    const s = Math.floor(ms / 1000);
    return { m: months, d, h, mi, s };
  }

  function setUnit(id, n, one, many) {
    $("#c-" + id).textContent = n;
    $("#l-" + id).textContent = n === 1 ? one : many;
  }

  function tickCounter() {
    const t = elapsed();
    setUnit("months", t.m, "month", "months");
    setUnit("days", t.d, "day", "days");
    setUnit("hours", t.h, "hour", "hours");
    setUnit("mins", t.mi, "minute", "minutes");
    setUnit("secs", t.s, "second", "seconds");
  }

  function startCounter() {
    tickCounter();
    if (!counterTimer) counterTimer = setInterval(tickCounter, 1000);
  }

  /* ----- letter with typewriter effect ----- */
  const overlay = $("#overlay");
  const letterCard = $("#letter");
  const letterText = $("#letterText");
  let typed = false, typing = false, timer = null, autoScroll = true;

  letterCard.addEventListener("wheel", () => { autoScroll = false; }, { passive: true });
  letterCard.addEventListener("touchmove", () => { autoScroll = false; }, { passive: true });

  function renderFull() {
    letterText.innerHTML = "";
    LETTER.forEach((t) => {
      const p = document.createElement("p");
      p.textContent = t;
      letterText.appendChild(p);
    });
  }

  function finishTyping() {
    clearTimeout(timer);
    typing = false;
    typed = true;
    renderFull();
    $("#skipBtn").style.display = "none";
  }

  function typeLetter() {
    typing = true;
    autoScroll = true;
    letterText.innerHTML = "";
    let pi = 0, ci = 0;
    let el = newPara();

    function newPara() {
      const p = document.createElement("p");
      p.className = "typing";
      letterText.appendChild(p);
      return p;
    }

    function tick() {
      if (!typing) return;
      const para = LETTER[pi];
      if (ci < para.length) {
        const ch = para[ci++];
        el.textContent += ch;
        if (autoScroll) letterCard.scrollTop = letterCard.scrollHeight;
        let d = 24;
        if (".!?".includes(ch)) d = 280;
        else if (",;".includes(ch)) d = 130;
        else if (ch === "\n") d = 350;
        timer = setTimeout(tick, d);
      } else {
        el.classList.remove("typing");
        pi++;
        if (pi >= LETTER.length) { finishTyping(); return; }
        el = newPara();
        ci = 0;
        timer = setTimeout(tick, 600);
      }
    }
    tick();
  }

  function openLetter() {
    overlay.classList.add("open");
    letterCard.scrollTop = 0;
    if (typed) { renderFull(); $("#skipBtn").style.display = "none"; return; }
    if (typing) return;
    $("#skipBtn").style.display = "";
    if (reduceMotion) finishTyping(); else typeLetter();
  }

  $("#surpriseBtn").addEventListener("click", openLetter);
  $("#skipBtn").addEventListener("click", finishTyping);
  $("#closeBtn").addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") overlay.classList.remove("open"); });
})();
</script>
